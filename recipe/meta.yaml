{% set name = "pint" %}
{% set version = "0.25.3" %}
{% set sha256 = "f8f5df6cf65314d74da1ade1bf96f8e3e4d0c41b51577ac53c49e7d44ca5acee" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  script: SETUPTOOLS_SCM_PRETEND_VERSION={{ version }} ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<312 or (win and py>=314)]

requirements:
  host:
    - python
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python
    - flexcache
    - flexparser
    - platformdirs
    - typing_extensions

test:
  requires:
    - python
    - pip
  imports:
    - {{ name }}
  commands:
    - pip check
    - python -c "import pint; assert pint.__version__ != '0.00'"
    - pint-convert --help

about:
  home: https://github.com/hgrecco/pint
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Operate and manipulate physical quantities in Python
  description: |
    Pint is a Python package to define, operate and manipulate physical
    quantities: the product of a numerical value and a unit of measurement.
    It allows arithmetic operations between them and conversions from and to
    different units. It is distributed with a comprehensive list of physical
    units, prefixes and constants. Due to its modular design, you can extend
    (or even rewrite!) the complete list without changing the source code.
    It supports a lot of numpy mathematical operations without monkey
    patching or wrapping numpy.
  dev_url: https://github.com/hgrecco/pint
  doc_url: https://pint.readthedocs.org/

extra:
  anaconda-services:
    ref:
      - https://anaconda.zendesk.com/agent/tickets/109074
  recipe-maintainers:
    - dopplershift
    - amaloney
